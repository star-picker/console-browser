[package]
name = "cb-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
cb-core = { version = "0.1.0", path = "../cb-core" }
cb-extract = { version = "0.1.0", path = "../cb-extract" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
cb-net = { version = "0.1.0", path = "../cb-net" }
cb-store = { version = "0.1.0", path = "../cb-store" }
tempfile = "3.27.0"