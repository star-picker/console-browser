<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cb — web mirror</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1115; color: #e6e6e6;
         font: 16px/1.7 -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  header { position: sticky; top: 0; display: flex; gap: 12px; align-items: center;
           padding: 10px 16px; background: #161920; border-bottom: 1px solid #262b36; }
  header input { flex: 1; background: #0f1115; color: #e6e6e6; border: 1px solid #303845;
                 border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  header button { background: #2a6df4; color: #fff; border: 0; border-radius: 8px;
                  padding: 8px 16px; font-size: 15px; cursor: pointer; }
  #status { color: #8b93a1; font-size: 13px; padding: 6px 16px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 20px 96px; }
  main h1 { font-size: 30px; line-height: 1.3; margin: 28px 0 14px; }
  main h2 { font-size: 24px; margin: 26px 0 12px; }
  main h3 { font-size: 20px; margin: 22px 0 10px; }
  main p { margin: 0 0 16px; }
  main li { margin: 4px 0; }
  main pre { background: #151924; border: 1px solid #262b36; border-radius: 10px;
             padding: 14px; overflow-x: auto; white-space: pre-wrap; }
  main blockquote { margin: 0 0 16px; padding: 4px 14px; border-left: 3px solid #3a4considerable;
                    color: #b8c0cc; }
  main hr { border: 0; border-top: 1px solid #262b36; margin: 24px 0; }
  main .notice { background: #2a2313; border: 1px solid #6b5a1f; border-radius: 8px;
                 padding: 10px 14px; margin: 12px 0; }
  main .table { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  main .img { margin: 14px 0; color: #8b93a1; font-size: 13px; }
  main .img img { max-width: 100%; height: auto; border-radius: 8px; display: block; }
  main .img figcaption { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <form id="go"><input id="url" placeholder="输入网址后回车" autocomplete="off"><button>打开</button></form>
</header>
<div id="status">connecting…</div>
<main id="page"><p>等待第一帧…</p></main>
<script>
const START_URL = window.__CB_START_URL__ || null;
const status = document.getElementById('status');
const page = document.getElementById('page');
const url = document.getElementById('url');
function el(kind, text) {
  if (kind === 'hr') return document.createElement('hr');
  if (kind === 'pre' || kind === 'table') { const n = document.createElement('pre'); n.textContent = text; return n; }
  if (kind === 'quote') { const n = document.createElement('blockquote'); n.textContent = text; return n; }
  if (kind === 'notice') { const n = document.createElement('div'); n.className = 'notice'; n.textContent = text; return n; }
  if (kind === 'img') {
    const n = document.createElement('figure');
    n.className = 'img';
    if (text && text !== '图片') { const cap = document.createElement('figcaption'); cap.textContent = text; n.appendChild(cap); }
    return n;
  }
  if (/^h[1-6]$/.test(kind)) { const n = document.createElement(kind); n.textContent = text; return n; }
  if (kind === 'li') { const n = document.createElement('div'); n.textContent = '• ' + text; return n; }
  const n = document.createElement('p'); n.textContent = text; return n;
}
function render(snap) {
  status.textContent = snap.status + ' · ' + snap.url;
  document.title = snap.title || snap.url || 'cb';
  if (document.activeElement !== url) url.value = snap.url;
  page.replaceChildren(...snap.lines.map(l => {
    const node = el(l.kind, l.text);
    if (l.kind === 'img' && l.url) {
      const img = document.createElement('img');
      img.src = l.url;
      img.loading = 'lazy';
      img.alt = l.text || '';
      node.prepend(img);
    }
    return node;
  }));
  window.scrollTo({ top: 0 });
}
const es = new EventSource('/events');
es.addEventListener('snapshot', ev => render(JSON.parse(ev.data)));
es.onerror = () => { status.textContent = 'disconnected — retrying…'; };
async function navigate(target) {
  if (!target) return;
  status.textContent = 'loading ' + target;
  try {
    const res = await fetch('/api/navigate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url: target }) });
    render(await res.json());
  } catch (e) { status.textContent = 'navigate failed: ' + e; }
}
document.getElementById('go').addEventListener('submit', ev => {
  ev.preventDefault();
  navigate(url.value.trim());
});
if (START_URL) navigate(START_URL);
</script>
</body>
</html>
