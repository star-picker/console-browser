[package]
name = "cb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cb-dom = { version = "0.1.0", path = "../cb-dom" }
cb-extract = { version = "0.1.0", path = "../cb-extract" }
cb-net = { version = "0.1.0", path = "../cb-net" }
cb-store = { version = "0.1.0", path = "../cb-store" }
encoding_rs = "0.8.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
