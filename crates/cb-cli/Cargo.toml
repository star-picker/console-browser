[package]
name = "cb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
cb-core = { version = "0.1.0", path = "../cb-core" }
cb-extract = { version = "0.1.0", path = "../cb-extract" }
cb-mcp = { version = "0.1.0", path = "../cb-mcp" }
cb-net = { version = "0.1.0", path = "../cb-net" }
cb-store = { version = "0.1.0", path = "../cb-store" }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "cb"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

